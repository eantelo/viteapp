<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Aplicar el tema antes de que React se cargue para evitar parpadeos.
      (function () {
        const storageKey = 'vite-ui-theme';
        const root = document.documentElement;
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let theme = null;

        try {
          theme = localStorage.getItem(storageKey);
        } catch {
          // El almacenamiento puede estar bloqueado por la configuración del navegador.
        }

        root.classList.toggle('dark', theme === 'dark' || (theme !== 'light' && prefersDark));
      })();
    </script>
    <style>
      /* Estilos críticos para evitar flash de contenido sin estilo (FOUC) */
      html.dark {
        background-color: #0a0a0a; /* Fallback para oklch(0.145 0 0) */
        color-scheme: dark;
      }
      html:not(.dark) {
        background-color: #ffffff; /* Fallback para oklch(1 0 0) */
        color-scheme: light;
      }
      body {
        background-color: inherit;
        margin: 0;
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="SalesNet" />
    <meta
      name="description"
      content="SalesNet centraliza ventas, inventario, compras, clientes y almacenes para equipos comerciales y operativos."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_BO" />
    <meta property="og:title" content="SalesNet | Gestión comercial e inventario" />
    <meta
      property="og:description"
      content="Gestiona ventas, productos, clientes, compras y almacenes desde una sola aplicación."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237c3aed'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial,sans-serif' font-size='34' font-weight='700' fill='white'%3ES%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
    <title>SalesNet | Gestión comercial e inventario</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
